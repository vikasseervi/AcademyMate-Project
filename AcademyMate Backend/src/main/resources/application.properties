spring.datasource.url=jdbc:mysql://localhost:3306/AcademyMate
spring.datasource.username=root
spring.datasource.password=root

#Turn off spring boot banner
spring.main.banner-mode=off

#Reduce logging level. Set logging level to warm
logging.level.root=warn

# Show JPA/Hibernate logging messages
logging.level.org.hibernate.SQL=trace
logging.level.org.hibernate.orm.jdbc.bind=trace

#logging.level.org.springframework.web=DEBUG
logging.level.com.fasterxml.jackson=DEBUG

# Level2 caching enable horela!!!
spring.jpa.properties.hibernate.cache.use_second_level_cache = true
spring.jpa.properties.hibernate.cache.region.factory_class = org.hibernate.cache.jcache.JCacheRegionFactory
spring.jpa.properties.javax.cache.provider = org.ehcache.jsr107.EhcacheCachingProvider
logging.level.org.hibernate.cache.spi = DEBUG